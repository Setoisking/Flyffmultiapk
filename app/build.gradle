plugins {
    id 'com.android.application'
}

def buildVerCode = System.getenv("GITHUB_RUN_NUMBER") ? System.getenv("GITHUB_RUN_NUMBER").toInteger() : 60
def buildVerName = "1.0." + buildVerCode

android {
    namespace 'com.flyff.multiclient'
    compileSdk 34

    defaultConfig {
        applicationId "com.flyff.multiclient"
        minSdk 21
        targetSdk 34
        versionCode buildVerCode
        versionName buildVerName

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation platform('org.jetbrains.kotlin:kotlin-bom:1.8.22')
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'androidx.core:core:1.12.0'
}
