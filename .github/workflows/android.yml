name: Build and Release APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:


permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Code auschecken
        uses: actions/checkout@v4

      - name: Java 17 einrichten
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Gradle 8.5 fest einrichten
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.5'

      - name: Android Debug APK bauen
        run: gradle :app:assembleDebug --no-daemon --stacktrace

      - name: APK umbenennen
        run: |
          mkdir -p release-files
          cp app/build/outputs/apk/debug/*.apk release-files/FlyffMultiClient.apk

      - name: GitHub Release erstellen
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: Flyff MultiClient v1.0.${{ github.run_number }}
          draft: false
          prerelease: false
          files: release-files/FlyffMultiClient.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          
